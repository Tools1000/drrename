name: Build macOS

on:
  workflow_dispatch:
    inputs:
      signing-identity:
        description: 'Signing identity (e.g. "Developer ID Application: Your Name (TEAMID)")'
        required: true
      maven-profile:
        description: 'Maven profile to activate'
        required: true
        default: 'macosx-aarch64'
        type: choice
        options:
          - macosx-aarch64
          - macosx-x86_64

env:
  JAVA_VERSION: 17

jobs:
  build_macos:
    name: Build and Sign macOS App
    runs-on: ${{ inputs.maven-profile == 'macosx-aarch64' && 'macos-14' || 'macos-13' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          distribution: 'temurin'

      - name: Build app image
        run: mvn -B -DskipTests -Dmaven.javadoc.skip=true -P${{ inputs.maven-profile }},all package


      - name: Build jpackage app image
        run: |
          APP_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
          cp target/drrename-*.jar target/libs/
          $JAVA_HOME/bin/jpackage \
            --type app-image \
            --name Dr.Rename \
            --app-version "$APP_VERSION" \
            --input target/libs \
            --main-jar $(ls target/libs/drrename-*.jar | xargs basename) \
            --main-class drrename.Launcher \
            --module-path target/mods \
            --add-modules java.desktop,java.base,java.logging,java.xml,java.scripting,java.compiler,java.instrument,jdk.unsupported,javafx.base,javafx.graphics,javafx.controls,javafx.fxml,java.sql,java.naming \
            --dest target/jpackage \
            --icon dist/mac/drrename.icns \
            --mac-package-identifier com.drrename

      - name: Codesign, package and notarize
        uses: kerner1000/github-actions/codesign-macos@main
        with:
          app-name: Dr.Rename
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          team-id: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          notarization-password: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          identity: ${{ inputs.signing-identity }}
          jpackage-output-dir: target/jpackage
          entitlements-file: dist/mac/Dr.Rename.entitlements
          icon-file: dist/mac/drrename.icns
          background-file: dist/mac/installer-background.png

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DrRename-macOS-${{ inputs.maven-profile }}
          path: target/jpackage/Dr.Rename-*.dmg
          if-no-files-found: error
